[project]
name = "false-confidence"
version = "1.0.0"
description = "Code for 'False Confidence: Automated Labels Confound Fairness Audits in Cervical Spine Segmentation' (FAIMI 2026)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Linus Juni", email = "s225224@dtu.dk" },
    { name = "Aasa Feragen" },
    { name = "Aditya Parikh" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "nibabel>=5.3",
    "nnunetv2==2.7.0",
    "numpy>=2.2",
    "pandas>=2.2",
    "patito>=0.8.6",
    "polars>=1.38",
    "pyarrow>=19",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.2",
    "scikit-learn>=1.6",
    "scikit-posthocs>=0.12",
    "scipy>=1.15",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "surface-distance>=0.1",
]

[project.urls]
Repository = "https://github.com/linusjuni/false-confidence"
Data = "https://data.midrc.org/discovery/H6K0-A61V/"

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/false_confidence"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
